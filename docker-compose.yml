version: "3.9"

# ⚠️  Copy .env.example → .env and fill in your credentials before running.
# Never commit .env to version control.

services:
  postgres:
    image: postgres:15-alpine
    container_name: fingard_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema:/docker-entrypoint-initdb.d   # auto-run on first start
    networks:
      - fingard_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fingard_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fingard.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fingard_net

volumes:
  postgres_data:

networks:
  fingard_net:
    driver: bridge
